[project]
name = "pyrex"
version = "1.0.0"
description = "Adding eccentricity to quasi-circular waveforms."
readme = "README.md"
authors = [{ name = "Amin Rouan Serik", email = "aminrouanserik@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.12"
keywords = ["gravitational-waves", "eccentricity", "waveforms", "astrophysics"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

dependencies = [
    "gw-eccentricity>=2.0.0,<3.0.0",
    "phenomxpy",
    "pickleshare>=0.7.5,<0.8.0",
    "pycbc>=2.9.0,<3.0.0",
    "qcextender>=0.4.7,<0.5.0",
    "scipy>=1.16.2,<2.0.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=6.30.1",
    "mkdocs>=1.6.1",
    "mkdocs-gen-files>=0.5.0",
    "mkdocs-literate-nav>=0.6.2",
    "mkdocs-material>=9.7.0",
    "mkdocs-section-index>=0.3.10",
    "mkdocstrings[python]>=0.30.1",
    "pytest>=9.0.1",
]

[tool.pytest.ini_options]
addopts = "-v"
testpaths = ["tests"]

[tool.uv.sources]
phenomxpy = { path = "phenomxpy-0.1.0.tar.gz" }
qcextender = { path = "qcextender-0.4.9.tar.gz" }

[project.urls]
Homepage = "https://github.com/aminrouanserik/pyrex"
Repository = "https://github.com/aminrouanserik/pyrex"
Documentation = "https://aminrouanserik.github.io/pyrex/"
Issues = "https://github.com/aminrouanserik/pyrex/issues"
